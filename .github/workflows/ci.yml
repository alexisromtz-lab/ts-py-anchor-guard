name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: self-tests
        run: |
          python -m ts_py_anchor_guard.anchor_oracle --self-test
          python -m ts_py_anchor_guard.viewport_embed --self-test
          python -m ts_py_anchor_guard.subpixel_probe --self-test
      - name: self-test of the live oracle (needs node >= 22.6)
        run: |
          # Exit 2 means "no runtime here", which is a gap to announce, not a failure of the
          # package: this runner can verify the static backend only. Any other code fails.
          rc=0
          python -m ts_py_anchor_guard.live_oracle --self-test || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::warning title=live oracle not measured::node >= 22.6 unavailable on this runner"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
      - name: fixtures conform
        run: |
          python -m ts_py_anchor_guard.anchor_oracle \
            --fuente fixtures/engine.ts --referencia fixtures/anchors.json

  action:
    # The action is the product's front door: if it is only tested by hand, it is not tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: self-test de cada modulo a traves de la action
        uses: ./
        with:
          check: anchor
          self-test: true
      - name: embed self-test
        uses: ./
        with:
          check: embed
          self-test: true
      - name: probe self-test
        uses: ./
        with:
          check: probe
          self-test: true
      - name: anclas reales contra el motor sintetico
        id: oraculo
        uses: ./
        with:
          check: anchor
          source: fixtures/engine.ts
          reference: fixtures/anchors.json
      - name: el RC sale como output y como codigo
        run: |
          echo "rc declarado: ${{ steps.oraculo.outputs.rc }}"
          test "${{ steps.oraculo.outputs.rc }}" = "0"
