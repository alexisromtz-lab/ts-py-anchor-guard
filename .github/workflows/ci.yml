name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: self-tests
        run: |
          python -m ts_py_anchor_guard.anchor_oracle --self-test
          python -m ts_py_anchor_guard.viewport_embed --self-test
          python -m ts_py_anchor_guard.subpixel_probe --self-test
      - name: fixtures conform
        run: |
          python -m ts_py_anchor_guard.anchor_oracle \
            --fuente fixtures/engine.ts --referencia fixtures/anchors.json
