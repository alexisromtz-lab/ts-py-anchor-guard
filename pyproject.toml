[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-py-anchor-guard"
version = "0.9.0"
description = "Cross-language anchor verifier and 1:1 viewport / subpixel guards for TypeScript-to-Python ports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexis Romero" }]
keywords = ["testing", "typescript", "python", "graphics", "ci", "porting"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[tool.setuptools]
packages = ["ts_py_anchor_guard"]
