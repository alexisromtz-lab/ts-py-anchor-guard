name: ts-py-anchor-guard
description: >-
  Catch a TypeScript-to-Python port that drifted: exact numeric parity, a 1:1 viewport that
  was rescaled, and sub-pixel phase from one pair of profiles. Exit codes are the contract
  (0 conforming, 1 diverging with the cause named, 2 not measured, 20 bad invocation).
author: alexisromtz-lab
branding:
  icon: check-circle
  color: blue

inputs:
  check:
    description: >-
      Which check to run — `anchor`, `census`, `diff`, `embed` or `probe`. `diff` reads the same
      source under two deployments and reports the anchors whose value moves between them.
    required: true
  self-test:
    description: >-
      Run the module's own self-test instead of a measurement. Use it to prove the wiring of
      this action in one step, with no fixture to prepare.
    required: false
    default: "false"
  source:
    description: '`anchor`: TypeScript file whose declarations are evaluated.'
    required: false
    default: ""
  reference:
    description: '`anchor`: JSON `{name: value}` or `{name: {puntos, valores}}`.'
    required: false
    default: ""
  manifest:
    description: >-
      `anchor`: a versioned manifest of signed correspondences. Takes the place of `source` and
      `reference`, and measures every pair it declares.
    required: false
    default: ""
  backend:
    description: '`anchor`: who produces the reference values — `auto`, `node` or `estatico`.'
    required: false
    default: "auto"
  tolerance:
    description: '`anchor`: relative tolerance. The default 0.0 is exact and stays exact.'
    required: false
    default: "0.0"
  profile-a:
    description: '`probe`: file with the reference profile (floats separated by spaces).'
    required: false
    default: ""
  profile-b:
    description: '`probe`: file with the measured profile.'
    required: false
    default: ""
  bands:
    description: '`probe`: number of bands for the scale fit.'
    required: false
    default: ""
  max-shift:
    description: '`probe`: largest shift searched, in samples.'
    required: false
    default: ""
  canvas:
    description: '`embed`: canvas height and width, in that order, space separated.'
    required: false
    default: ""
  window:
    description: '`embed`: sub-viewport height and width, in that order, space separated.'
    required: false
    default: ""
  receipt-file:
    description: 'Write `rc` and `receipt` here too. Needed to read a failure: see below.'
    required: false
    default: ""
  rect:
    description: '`embed`: the rectangle the engine actually uses, `X Y A H`. Omit to centre.'
    required: false
    default: ""
  environment:
    description: >-
      `census`: JSON `{VARIABLE: "value"}` the source reads. Without it every `process.env` read is
      a gap, because a deployment's value is not in the source.
    required: false
    default: ""
  env-base:
    description: >-
      `diff`: JSON of the reference deployment — the map the destination is read against. Its
      fingerprint goes on the receipt, so the delta names which side it came from.
    required: false
    default: ""
  env-destino:
    description: '`diff`: JSON of the deployment being compared with the reference.'
    required: false
    default: ""
  exigir-invariancia:
    description: >-
      `diff`: an anchor whose value moves between the two maps exits 1 instead of 0. Off by
      default — moving from `staging` to `production` is a measurement, not necessarily a defect.
    required: false
    default: "false"

outputs:
  rc:
    description: The module's exit code, propagated unchanged.
    value: ${{ steps.medir.outputs.rc }}
  receipt:
    description: >-
      The receipt, one line. Under 2 KiB by construction: a receipt that would be longer is
      summarised — counts and the finding kept, large tables reduced to their size and names — and
      `bytes` says how big the whole one was. Set `receipt-file` to keep it in full.
    value: ${{ steps.medir.outputs.receipt }}

runs:
  using: composite
  steps:
    - id: medir
      shell: bash
      env:
        ENTRADA_CHECK: ${{ inputs.check }}
        ENTRADA_SELF_TEST: ${{ inputs.self-test }}
        ENTRADA_SOURCE: ${{ inputs.source }}
        ENTRADA_REFERENCE: ${{ inputs.reference }}
        ENTRADA_MANIFEST: ${{ inputs.manifest }}
        ENTRADA_BACKEND: ${{ inputs.backend }}
        ENTRADA_TOLERANCE: ${{ inputs.tolerance }}
        ENTRADA_PROFILE_A: ${{ inputs.profile-a }}
        ENTRADA_PROFILE_B: ${{ inputs.profile-b }}
        ENTRADA_BANDS: ${{ inputs.bands }}
        ENTRADA_MAX_SHIFT: ${{ inputs.max-shift }}
        ENTRADA_CANVAS: ${{ inputs.canvas }}
        ENTRADA_WINDOW: ${{ inputs.window }}
        ENTRADA_RECT: ${{ inputs.rect }}
        ENTRADA_RECEIPT_FILE: ${{ inputs.receipt-file }}
        ENTRADA_ENVIRONMENT: ${{ inputs.environment }}
        ENTRADA_ENV_BASE: ${{ inputs.env-base }}
        ENTRADA_ENV_DESTINO: ${{ inputs.env-destino }}
        ENTRADA_EXIGIR_INVARIANCIA: ${{ inputs.exigir-invariancia }}
        GUARDA: ${{ github.action_path }}
      run: |
        # `shell: bash` in a composite action is `bash -e`, so every statement below would abort
        # the script on any non-zero status — including the module's own exit code, which is the
        # value this action exists to propagate. Measured on run 45842590972: the assignment that
        # captures a divergence killed the script before it could write its outputs or its file.
        set +e -u -o pipefail

        # A refusal at the boundary is a verdict too, and it leaves by the same door as the
        # module's own exit 20: the caller reads `rc=20`, never an empty slot. Measured on run
        # 45895456729 — a CI assertion on a refused invocation found the slot empty, because
        # this script published `rc` only after the module had run. `outcome: failure` says the
        # step did not conform; `rc` says what the call itself was worth.
        rechazar() {
          printf 'rc=20\nreceipt=\n' >> "${GITHUB_OUTPUT:-/dev/null}"
          printf '::error title=ts-py-anchor-guard::%s\n' "$1"
          exit 20
        }

        case "$ENTRADA_CHECK" in
          anchor) modulo=anchor_oracle ;;
          census) modulo=anchor_oracle ;;
          diff)   modulo=anchor_oracle ;;
          embed)  modulo=viewport_embed ;;
          probe)  modulo=subpixel_probe ;;
          *)
            rechazar "check desconocido '$ENTRADA_CHECK' (anchor|census|diff|embed|probe)"
            ;;
        esac

        # Every value crosses as a separate argv entry: no word splitting, no eval. A path with
        # a space is a path with a space, not two arguments.
        args=(--json)
        if [ "$ENTRADA_SELF_TEST" = "true" ]; then
          args=(--self-test)
        else
          case "$ENTRADA_CHECK" in
            census)
              if [ -z "$ENTRADA_SOURCE" ]; then
                rechazar "check=census needs source"
              fi
              args+=(--fuente "$ENTRADA_SOURCE" --censo)
              if [ -n "$ENTRADA_ENVIRONMENT" ]; then
                args+=(--entorno "$ENTRADA_ENVIRONMENT")
              fi
              ;;
            diff)
              if [ -z "$ENTRADA_SOURCE" ] || [ -z "$ENTRADA_ENV_BASE" ] ||
                 [ -z "$ENTRADA_ENV_DESTINO" ]; then
                rechazar "check=diff needs source, env-base and env-destino"
              fi
              args+=(--fuente "$ENTRADA_SOURCE" --entorno-base "$ENTRADA_ENV_BASE" \
                     --entorno-destino "$ENTRADA_ENV_DESTINO")
              if [ "$ENTRADA_EXIGIR_INVARIANCIA" = "true" ]; then
                args+=(--exigir-invariancia)
              fi
              ;;
            anchor)
              if [ -n "$ENTRADA_MANIFEST" ]; then
                # A manifest carries its own source, reference and mappings per pair: asking
                # for `source` here would demand an argument the manifest already answers.
                if [ -n "$ENTRADA_SOURCE" ] || [ -n "$ENTRADA_REFERENCE" ]; then
                  rechazar "manifest excludes source and reference"
                fi
                args+=(--manifest "$ENTRADA_MANIFEST")
              else
                if [ -z "$ENTRADA_SOURCE" ] || [ -z "$ENTRADA_REFERENCE" ]; then
                  rechazar "check=anchor needs source and reference, or a manifest"
                fi
                args+=(--fuente "$ENTRADA_SOURCE" --referencia "$ENTRADA_REFERENCE")
              fi
              args+=(--backend "${ENTRADA_BACKEND:-auto}" --tolerancia "${ENTRADA_TOLERANCE:-0.0}")
              ;;
            probe)
              if [ -z "$ENTRADA_PROFILE_A" ] || [ -z "$ENTRADA_PROFILE_B" ]; then
                rechazar "check=probe needs profile-a and profile-b"
              fi
              args+=(--a "$ENTRADA_PROFILE_A" --b "$ENTRADA_PROFILE_B")
              if [ -n "$ENTRADA_BANDS" ]; then args+=(--bandas "$ENTRADA_BANDS"); fi
              if [ -n "$ENTRADA_MAX_SHIFT" ]; then args+=(--max-shift "$ENTRADA_MAX_SHIFT"); fi
              ;;
            embed)
              if [ -z "$ENTRADA_CANVAS" ] || [ -z "$ENTRADA_WINDOW" ]; then
                rechazar "check=embed needs canvas and window"
              fi
              read -r -a lona <<< "$ENTRADA_CANVAS"
              read -r -a ventana <<< "$ENTRADA_WINDOW"
              args+=(--canvas "${lona[@]}" --ventana "${ventana[@]}")
              if [ -n "$ENTRADA_RECT" ]; then
                read -r -a caja <<< "$ENTRADA_RECT"
                args+=(--rect "${caja[@]}")
              fi
              ;;
          esac
        fi

        # The package is used in place: the action is the clone, so nothing is installed and the
        # version under test is the one the caller pinned.
        salida=$(PYTHONPATH="$GUARDA" python3 -m "ts_py_anchor_guard.$modulo" "${args[@]}")
        rc=$?

        printf '%s\n' "$salida"
        # The receipt goes to the output *and* to the job summary, and both are surfaces a caller
        # reads: a 34 KiB step summary is noise in every PR that runs this, and a 34 KiB single
        # line is a truncation waiting for the first repository wider than this one. So the line is
        # summarised to a bounded size -- counts and the finding kept, wide tables reduced to their
        # size and names -- and the whole receipt is written to `receipt-file` when one is asked
        # for. A self-test prints prose, not a receipt, so it crosses untouched: it is the wiring
        # proof, and its length is the module's, not a caller's.
        if [ "$ENTRADA_SELF_TEST" = 'true' ]; then
          recibo=$(printf '%s' "$salida" | tr -d '\n')
        elif [ -z "$salida" ]; then
          # A module that refused before reading printed its cause on stderr and no receipt on
          # stdout (`SIN_ORACULO_VIVO`, run 46104450819). Publishing `rc` beside an empty receipt
          # is the honest answer; handing the empty string to the summariser published *its*
          # refusal in place of the module's and failed the step naming the wrong subject.
          recibo=''
        else
          recibo=$(printf '%s' "$salida" | PYTHONPATH="$GUARDA" python3 -m ts_py_anchor_guard._resumen)
          rc_resumen=$?
          if [ "$rc_resumen" -ne 0 ]; then
            rechazar "el recibo no se pudo resumir (rc=$rc_resumen): no se publica una linea ilegible"
          fi
        fi
        # A self-test prints prose, not a receipt: labelling it json would lie in the UI.
        fence='```'
        if [ "$ENTRADA_SELF_TEST" = 'true' ]; then fence='```text'; else fence='```json'; fi
        if [ -z "$recibo" ]; then
          {
            echo "### ts-py-anchor-guard · $ENTRADA_CHECK"
            echo ''
            echo "rc=$rc · ningun recibo en stdout: la causa esta en el log del paso."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        else
          {
            echo "### ts-py-anchor-guard · $ENTRADA_CHECK"
            echo ''
            echo "$fence"
            printf '%s\n' "$recibo"
            echo '```'
            if [ -n "$ENTRADA_RECEIPT_FILE" ]; then
              echo ''
              echo "Recibo completo en \`$ENTRADA_RECEIPT_FILE\`. El resumen de arriba conserva los"
              echo "conteos y el hallazgo; \`bytes\` mide el recibo entero."
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        fi

        destino="${GITHUB_OUTPUT:-/dev/null}"
        printf 'rc=%s\n' "$rc" >> "$destino"
        printf 'receipt=%s\n' "$recibo" >> "$destino"

        # Outputs do survive a failing step (measured, run 45842813192); this file is not a
        # workaround for that. It is here because a receipt is evidence worth keeping: an
        # artifact upload, or a reader coming back later, wants a file rather than the outputs
        # of a step it can no longer re-run. The file carries the *whole* receipt -- the one the
        # output line could not hold -- and the summary beside it, so the two cannot disagree
        # about which is which.
        if [ -n "$ENTRADA_RECEIPT_FILE" ]; then
          completo=$(printf '%s' "$salida" | tr -d '\n')
          {
            printf 'rc=%s\n' "$rc"
            printf 'receipt=%s\n' "$completo"
            if [ "$recibo" != "$completo" ]; then
              printf 'resumen=%s\n' "$recibo"
            fi
          } > "$ENTRADA_RECEIPT_FILE"
        fi

        exit "$rc"
